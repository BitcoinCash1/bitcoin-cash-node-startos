name: Check Upstream

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new upstream BCHN release
        run: |
          set -euo pipefail
          # Releases, not tags — GitLab tags can include extras; releases
          # are the versions Docker Hub mainnet/bitcoin-cash-node tracks.
          LATEST=$(curl -fsS \
            'https://gitlab.com/api/v4/projects/bitcoin-cash-node%2Fbitcoin-cash-node/releases?per_page=1' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['tag_name'] if r else '')")
          if [ -z "$LATEST" ]; then
            echo "Could not fetch upstream version"
            exit 0
          fi

          CURRENT="v$(sed -nE "s/^[[:space:]]*version:[[:space:]]*'([^:']+):.*/\1/p" startos/versions/current.ts | head -1)"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already at $LATEST — no update"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "auto-bump/$LATEST" >/dev/null; then
            echo "A bump PR for $LATEST is already open — nothing to do"
            exit 0
          fi

          echo "Updating $CURRENT -> $LATEST"
          bash scripts/auto-bump.sh "$LATEST"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
